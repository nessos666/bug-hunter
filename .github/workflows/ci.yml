name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest
      - name: Self-test
        run: python -m bug_hunter selftest
      - name: Smoke scan (text)
        run: python -m bug_hunter scan examples --format text
      - name: Smoke scan (json)
        run: python -m bug_hunter scan examples > findings.json
      - name: SARIF is valid JSON 2.1.0
        run: |
          python -m bug_hunter scan examples --format sarif > results.sarif
          python -c "import json,sys; d=json.load(open('results.sarif')); assert d['version']=='2.1.0'; n=len(d['runs'][0]['results']); assert n>0; print('SARIF ok:', n, 'results')"
      - name: Determinism (two runs must be byte-identical)
        run: |
          python -m bug_hunter scan examples --format text > run1.txt
          python -m bug_hunter scan examples --format text > run2.txt
          cmp run1.txt run2.txt
          echo "deterministic ok"
      - name: Fail-on works
        run: |
          set +e
          python -m bug_hunter scan examples --fail-on error > /dev/null
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }

  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Scan itself
        run: python -m bug_hunter scan src --format text || true
